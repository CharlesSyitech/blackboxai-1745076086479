name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Design-system contract: every foreground/background pair the tokens
      # assert must actually meet WCAG 2.2 (docs/07).
      - name: Contrast contract
        run: npm run check:contrast

      # Governance guards: no drafting placeholder reaches production, and
      # localized slugs and route segments stay complete and unambiguous
      # (docs/03, docs/04).
      - name: Content guards
        run: npm run check:content

      - name: Brand CSS is generated from brands.json
        run: npm run check:brand-css

      # Reports which supplied assets are in place. Does not fail while they
      # are still awaited — only if one that WAS present has disappeared.
      - name: Assets
        run: npm run check:assets

      - name: Build
        run: npm run build
